<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" width="860" height="640" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="860" height="640" rx="16" fill="#0D131F" stroke="#1E293B" stroke-width="1.6"/>

  <text x="430" y="40" text-anchor="middle" fill="#F8FAFC" font-size="24" font-weight="800">Four Physical Planes &amp; Guardrails</text>
  <text x="430" y="68" text-anchor="middle" fill="#94A3B8" font-size="16">Is each plane being held in place, or lost?</text>

  <!-- 2 x 2 PLANES -->
  <rect x="20" y="88" width="404" height="140" rx="12" fill="#111C2D" stroke="#38BDF8" stroke-width="2"/>
  <text x="40" y="122" fill="#38BDF8" font-size="19" font-weight="800">1 · Roots &amp; Moisture</text>
  <text x="40" y="160" fill="#F8FAFC" font-size="16.5"><tspan fill="#22C55E" font-weight="800">Holding:</tspan> root-knitting, wicking</text>
  <text x="40" y="194" fill="#F8FAFC" font-size="16.5"><tspan fill="#FB7185" font-weight="800">Losing:</tspan> pan-smearing, drying</text>

  <rect x="436" y="88" width="404" height="140" rx="12" fill="#1F1912" stroke="#F59E0B" stroke-width="2"/>
  <text x="456" y="122" fill="#FBBF24" font-size="19" font-weight="800">2 · Soil Surface &amp; Water</text>
  <text x="456" y="160" fill="#F8FAFC" font-size="16.5"><tspan fill="#22C55E" font-weight="800">Holding:</tspan> percolating, slowing runoff</text>
  <text x="456" y="194" fill="#F8FAFC" font-size="16.5"><tspan fill="#FB7185" font-weight="800">Losing:</tspan> crusting, sheet-stripping</text>

  <rect x="20" y="240" width="404" height="140" rx="12" fill="#0F2625" stroke="#2DD4BF" stroke-width="2"/>
  <text x="40" y="274" fill="#2DD4BF" font-size="19" font-weight="800">3 · Canopy &amp; Shade</text>
  <text x="40" y="312" fill="#F8FAFC" font-size="16.5"><tspan fill="#22C55E" font-weight="800">Holding:</tspan> arch-shading, cooling</text>
  <text x="40" y="346" fill="#F8FAFC" font-size="16.5"><tspan fill="#FB7185" font-weight="800">Losing:</tspan> tree removal, baking</text>

  <rect x="436" y="240" width="404" height="140" rx="12" fill="#23172B" stroke="#A855F7" stroke-width="2"/>
  <text x="456" y="274" fill="#C084FC" font-size="19" font-weight="800">4 · Fire &amp; Renewal</text>
  <text x="456" y="312" fill="#F8FAFC" font-size="16.5"><tspan fill="#22C55E" font-weight="800">Holding:</tspan> mosaic cycling, reseeding</text>
  <text x="456" y="346" fill="#F8FAFC" font-size="16.5"><tspan fill="#FB7185" font-weight="800">Losing:</tspan> thicket-locking, fuel build-up</text>

  <!-- GUARDRAILS -->
  <rect x="20" y="396" width="820" height="224" rx="12" fill="#1B1320" stroke="#FB7185" stroke-width="2.2"/>
  <text x="430" y="432" text-anchor="middle" fill="#FB7185" font-size="19" font-weight="800">LANGUAGE GUARDRAILS · CHECKED ON EVERY SITE</text>

  <rect x="38" y="452" width="252" height="148" rx="10" fill="#0B0F17" stroke="#334155" stroke-width="1.3"/>
  <text x="56" y="486" fill="#F8FAFC" font-size="17" font-weight="800">No impersonation</text>
  <text x="56" y="518" fill="#CBD5E1" font-size="16">Never speaks for</text>
  <text x="56" y="542" fill="#CBD5E1" font-size="16">community voices</text>

  <rect x="304" y="452" width="252" height="148" rx="10" fill="#0B0F17" stroke="#334155" stroke-width="1.3"/>
  <text x="322" y="486" fill="#F8FAFC" font-size="17" font-weight="800">No invented claims</text>
  <text x="322" y="518" fill="#CBD5E1" font-size="16">No cultural, ceremonial</text>
  <text x="322" y="542" fill="#CBD5E1" font-size="16">or ownership claims</text>

  <rect x="570" y="452" width="252" height="148" rx="10" fill="#0E241E" stroke="#10B981" stroke-width="1.6"/>
  <text x="588" y="486" fill="#34D399" font-size="17" font-weight="800">Nouns withheld first</text>
  <text x="588" y="518" fill="#CBD5E1" font-size="16">Physical actions are</text>
  <text x="588" y="542" fill="#CBD5E1" font-size="16">described before any</text>
  <text x="588" y="566" fill="#6EE7B7" font-size="16" font-weight="700">scores are assigned</text>
</svg>
