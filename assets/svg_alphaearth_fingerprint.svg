<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <radialGradient id="sphereGlow" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#1E3A5F" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0.96"/>
    </radialGradient>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#A855F7"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="16" fill="#0D131F" stroke="#1E293B" stroke-width="1.5"/>

  <text x="600" y="42" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="800" letter-spacing="0.3">
    A 64-Number Fingerprint for Every 10 m Patch of Land
  </text>

  <!-- LEFT: 4 Earth Observation Streams -->
  <rect x="28" y="74" width="305" height="84" rx="11" fill="#111C2D" stroke="#38BDF8" stroke-width="2"/>
  <text x="48" y="106" fill="#38BDF8" font-size="17" font-weight="800">Optical Satellites</text>
  <text x="48" y="131" fill="#CBD5E1" font-size="14">Sentinel-2 &amp; Landsat seasonal colour</text>
  <text x="48" y="149" fill="#94A3B8" font-size="12.5">Green flush, bare soil &amp; fire patterns</text>

  <rect x="28" y="176" width="305" height="84" rx="11" fill="#131D2D" stroke="#2DD4BF" stroke-width="2"/>
  <text x="48" y="208" fill="#2DD4BF" font-size="17" font-weight="800">Cloud-Free Radar</text>
  <text x="48" y="233" fill="#CBD5E1" font-size="14">Sentinel-1 structural backscatter</text>
  <text x="48" y="251" fill="#94A3B8" font-size="12.5">Surface roughness &amp; soil moisture</text>

  <rect x="28" y="278" width="305" height="84" rx="11" fill="#19162B" stroke="#A855F7" stroke-width="2"/>
  <text x="48" y="310" fill="#C084FC" font-size="17" font-weight="800">Spaceborne 3D LiDAR</text>
  <text x="48" y="335" fill="#CBD5E1" font-size="14">Vertical tree height &amp; foliage layers</text>
  <text x="48" y="353" fill="#94A3B8" font-size="12.5">Separates tall trees from flat crops</text>

  <rect x="28" y="380" width="305" height="84" rx="11" fill="#1F1912" stroke="#F59E0B" stroke-width="2"/>
  <text x="48" y="412" fill="#FBBF24" font-size="17" font-weight="800">Climate &amp; Terrain</text>
  <text x="48" y="437" fill="#CBD5E1" font-size="14">Rainfall, temperature &amp; elevation</text>
  <text x="48" y="455" fill="#94A3B8" font-size="12.5">Accounts for wet vs. dry years</text>

  <!-- Converging Arrows -->
  <path d="M 333 116 C 395 116, 400 245, 452 245" stroke="#38BDF8" stroke-width="2.4" fill="none" marker-end="url(#arrB)"/>
  <path d="M 333 218 C 390 218, 400 262, 452 262" stroke="#2DD4BF" stroke-width="2.4" fill="none"/>
  <path d="M 333 320 C 390 320, 400 280, 452 280" stroke="#A855F7" stroke-width="2.4" fill="none" marker-end="url(#arrP)"/>
  <path d="M 333 422 C 395 422, 400 296, 452 296" stroke="#F59E0B" stroke-width="2.4" fill="none"/>

  <!-- CENTER: 64-Number Fingerprint -->
  <circle cx="585" cy="270" r="126" fill="url(#sphereGlow)" stroke="#38BDF8" stroke-width="2.6"/>
  <ellipse cx="585" cy="270" rx="126" ry="40" fill="none" stroke="#38BDF8" stroke-width="1.3" stroke-dasharray="5 4" opacity="0.65"/>
  <ellipse cx="585" cy="270" rx="46" ry="126" fill="none" stroke="#38BDF8" stroke-width="1.3" stroke-dasharray="5 4" opacity="0.55"/>

  <line x1="585" y1="270" x2="648" y2="190" stroke="#10B981" stroke-width="3.2" marker-end="url(#arrG)"/>
  <circle cx="654" cy="184" r="6.5" fill="#10B981" stroke="#F8FAFC" stroke-width="1.6"/>
  <text x="588" y="172" fill="#34D399" font-size="13.5" font-weight="800">Native Woodland</text>

  <line x1="585" y1="270" x2="512" y2="210" stroke="#FB7185" stroke-width="3.2"/>
  <circle cx="506" cy="204" r="6.5" fill="#FB7185" stroke="#F8FAFC" stroke-width="1.6"/>
  <text x="488" y="188" fill="#FDA4AF" font-size="13.5" font-weight="800">Ploughed Crop</text>

  <text x="585" y="294" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="800">64 Numbers</text>
  <text x="585" y="319" text-anchor="middle" fill="#7DD3FC" font-size="14.5" font-weight="700">AlphaEarth Fingerprint</text>
  <text x="585" y="340" text-anchor="middle" fill="#CBD5E1" font-size="13">One full year of land dynamics</text>

  <!-- Arrow Center -> Right -->
  <path d="M 713 270 L 768 270" stroke="#38BDF8" stroke-width="2.8" fill="none" marker-end="url(#arrB)"/>

  <!-- RIGHT: Why this solves greenness traps -->
  <rect x="778" y="78" width="394" height="182" rx="12" fill="#0E241E" stroke="#10B981" stroke-width="2.2"/>
  <text x="802" y="114" fill="#34D399" font-size="18" font-weight="800">Sees Past Simple "Greenness"</text>
  <text x="802" y="146" fill="#F8FAFC" font-size="14.5" font-weight="700">• Green crop vs. native woodland:</text>
  <text x="816" y="170" fill="#CBD5E1" font-size="13.8">Both look equally green in summer photos,</text>
  <text x="816" y="191" fill="#CBD5E1" font-size="13.8">but tillage timing and 3D tree height</text>
  <text x="816" y="212" fill="#CBD5E1" font-size="13.8">place them far apart in 64-D space.</text>
  <text x="802" y="242" fill="#6EE7B7" font-size="13.2" font-weight="700">✓ Captures structure, moisture &amp; seasons</text>

  <rect x="778" y="280" width="394" height="184" rx="12" fill="#111C2D" stroke="#38BDF8" stroke-width="2.2"/>
  <text x="802" y="316" fill="#38BDF8" font-size="18" font-weight="800">Anchored to Local Climate</text>
  <text x="802" y="348" fill="#F8FAFC" font-size="14.5" font-weight="700">• Desert sand vs. rainforest:</text>
  <text x="816" y="372" fill="#CBD5E1" font-size="13.8">Every pixel is compared against intact</text>
  <text x="816" y="393" fill="#CBD5E1" font-size="13.8">reference sites in its own bioregion —</text>
  <text x="816" y="414" fill="#CBD5E1" font-size="13.8">so naturally sparse land is not penalised.</text>
  <text x="802" y="446" fill="#FBBF24" font-size="13.2" font-weight="700">→ One shared input feeds all six maps</text>

  <text x="600" y="498" text-anchor="middle" fill="#94A3B8" font-size="13.5">
    Google DeepMind AlphaEarth Foundations — annual satellite embeddings scaled across 1.2 billion Australian land pixels
  </text>
</svg>
