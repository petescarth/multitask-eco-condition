<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrSky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrEmerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#A855F7"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrRose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#FB7185"/>
    </marker>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2DD4BF"/>
    </marker>
  </defs>

  <rect width="1600" height="760" rx="18" fill="url(#bgGrad)"/>

  <g stroke="#1E293B" stroke-width="1" opacity="0.45">
    <line x1="0" y1="95" x2="1600" y2="95"/>
    <line x1="0" y1="668" x2="1600" y2="668"/>
  </g>

  <text x="800" y="42" text-anchor="middle" fill="#F8FAFC" font-size="25" font-weight="800" letter-spacing="0.4">
    FULL MULTI-TASK ARCHITECTURE &amp; DOMAIN ISOLATION BOUNDARY (APPENDIX)
  </text>
  <text x="800" y="72" text-anchor="middle" fill="#94A3B8" font-size="16" font-weight="500">
    Signed-Quadratic 64-D Decoding + O(1) Bioregion Lookup → Shared 384-D Residual Trunk → 6 Heads &amp; 10 Calibrated Outputs
  </text>

  <!-- ZONES -->
  <rect x="24" y="106" width="298" height="548" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
  <text x="173" y="133" text-anchor="middle" fill="#38BDF8" font-size="13.5" font-weight="700" letter-spacing="1.0">1. INPUTS &amp; REGION LOOKUP</text>

  <rect x="346" y="106" width="320" height="548" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
  <text x="506" y="133" text-anchor="middle" fill="#10B981" font-size="13.5" font-weight="700" letter-spacing="1.0">2. SHARED ECOLOGICAL TRUNK</text>

  <rect x="690" y="106" width="886" height="548" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
  <text x="1133" y="133" text-anchor="middle" fill="#CBD5E1" font-size="13.5" font-weight="700" letter-spacing="1.0">3. SPECIALIZED HEADS, DETACHED ADAPTERS &amp; CONTINENTAL OUTPUTS</text>

  <!-- COL 1 -->
  <rect x="42" y="158" width="262" height="132" rx="12" fill="#111C2D" stroke="#38BDF8" stroke-width="2.2"/>
  <text x="173" y="189" text-anchor="middle" fill="#F8FAFC" font-size="16.5" font-weight="700">AlphaEarth 64-D Input</text>
  <text x="173" y="213" text-anchor="middle" fill="#38BDF8" font-size="12.5" font-weight="600">Signed-Quadratic Decoding</text>
  <text x="173" y="241" text-anchor="middle" fill="#CBD5E1" font-size="12.5" font-family="monospace">u = sgn(q)·(|q|/127.5)²</text>
  <text x="173" y="268" text-anchor="middle" fill="#94A3B8" font-size="12">1.2 billion pixels @ 80 m</text>

  <rect x="42" y="328" width="262" height="140" rx="12" fill="#1A152B" stroke="#A855F7" stroke-width="2.2"/>
  <text x="173" y="359" text-anchor="middle" fill="#F8FAFC" font-size="16.5" font-weight="700">O(1) Bioregion Table</text>
  <text x="173" y="384" text-anchor="middle" fill="#C084FC" font-size="12.5" font-weight="600">85 Bioregion Reference Vectors</text>
  <text x="173" y="411" text-anchor="middle" fill="#CBD5E1" font-size="12.5" font-family="monospace">r = LUT[bioregion_id]</text>
  <text x="173" y="438" text-anchor="middle" fill="#94A3B8" font-size="12">Instant GPU lookup (~2M px/s)</text>

  <rect x="42" y="506" width="262" height="124" rx="12" fill="#1F1912" stroke="#F59E0B" stroke-width="2.2"/>
  <text x="173" y="536" text-anchor="middle" fill="#F8FAFC" font-size="16" font-weight="700">Local Anomaly Vector</text>
  <text x="173" y="562" text-anchor="middle" fill="#FBBF24" font-size="12.5" font-family="monospace">delta = u − r  (64-D)</text>
  <text x="173" y="588" text-anchor="middle" fill="#CBD5E1" font-size="12">Routed strictly to Grazing Head</text>
  <text x="173" y="611" text-anchor="middle" fill="#10B981" font-size="12" font-weight="700">Sensitivity on eco heads = 0.000</text>

  <!-- COL 2 -->
  <rect x="366" y="164" width="280" height="86" rx="10" fill="#102527" stroke="#2DD4BF" stroke-width="2"/>
  <text x="506" y="194" text-anchor="middle" fill="#F8FAFC" font-size="16" font-weight="700">65-D Ecological Input</text>
  <text x="506" y="220" text-anchor="middle" fill="#5EEAD4" font-size="12.5" font-family="monospace">[ u (64-D), cos(u, r) ]</text>

  <rect x="366" y="284" width="280" height="196" rx="12" fill="#0E241E" stroke="#10B981" stroke-width="2.6"/>
  <text x="506" y="317" text-anchor="middle" fill="#F8FAFC" font-size="18.5" font-weight="800">Residual Trunk (384-D)</text>
  <text x="506" y="344" text-anchor="middle" fill="#34D399" font-size="13" font-weight="600">3 Residual SiLU Blocks + LayerNorm</text>
  <text x="506" y="371" text-anchor="middle" fill="#CBD5E1" font-size="12.5">6-Fold Spatially Blocked Ensemble</text>
  <rect x="380" y="390" width="252" height="40" rx="8" fill="#0B0F17" stroke="#10B981" stroke-width="1.2"/>
  <text x="506" y="415" text-anchor="middle" fill="#34D399" font-size="12" font-weight="700">Effective Rank: 8.6 → 49.8 (5.8×)</text>
  <text x="506" y="458" text-anchor="middle" fill="#94A3B8" font-size="11.8">≥ 25 km spatial validation exclusion</text>

  <rect x="366" y="512" width="280" height="118" rx="10" fill="#23121B" stroke="#FB7185" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="506" y="541" text-anchor="middle" fill="#FB7185" font-size="14.5" font-weight="800">STRICT DOMAIN ISOLATION</text>
  <text x="506" y="566" text-anchor="middle" fill="#F8FAFC" font-size="12.5">Zero eco-benchmark grazing labels</text>
  <text x="506" y="588" text-anchor="middle" fill="#CBD5E1" font-size="12">Detached adapters protect trunk</text>
  <text x="506" y="610" text-anchor="middle" fill="#FDA4AF" font-size="11.5">Adversarial region-invariance penalty</text>

  <!-- COL 3 -->
  <rect x="712" y="156" width="576" height="66" rx="9" fill="#111C2D" stroke="#38BDF8" stroke-width="1.8"/>
  <text x="728" y="182" fill="#38BDF8" font-size="14.5" font-weight="700">Head 1 · Ecological Structure (Adaptive Huber Loss)</text>
  <text x="728" y="206" fill="#CBD5E1" font-size="12.2">2.9M overlapping Queensland locations  |  Full backprop to shared trunk</text>
  <rect x="1308" y="156" width="248" height="66" rx="9" fill="#0D2234" stroke="#38BDF8" stroke-width="1.8"/>
  <text x="1432" y="184" text-anchor="middle" fill="#F8FAFC" font-size="15" font-weight="800">Output 1: Structure</text>
  <text x="1432" y="207" text-anchor="middle" fill="#7DD3FC" font-size="12.2">0 – 100 BioCondition scale</text>

  <rect x="712" y="236" width="576" height="66" rx="9" fill="#0F2621" stroke="#10B981" stroke-width="1.8"/>
  <text x="728" y="262" fill="#34D399" font-size="14.5" font-weight="700">Head 2 · Ecosystem Intactness (Adaptive Huber Loss)</text>
  <text x="728" y="286" fill="#CBD5E1" font-size="12.2">4.3M continental ecological rows  |  Strong continental correlation (r ≈ 0.82)</text>
  <rect x="1308" y="236" width="248" height="66" rx="9" fill="#0B241E" stroke="#10B981" stroke-width="1.8"/>
  <text x="1432" y="264" text-anchor="middle" fill="#F8FAFC" font-size="15" font-weight="800">Output 2: Intactness</text>
  <text x="1432" y="287" text-anchor="middle" fill="#6EE7B7" font-size="12.2">0 – 100 HCAS scale</text>

  <rect x="712" y="316" width="576" height="66" rx="9" fill="#1C152B" stroke="#A855F7" stroke-width="1.8"/>
  <text x="728" y="342" fill="#C084FC" font-size="14.5" font-weight="700">Head 3 · Climax Similarity (Bioregion-Anchored)</text>
  <text x="728" y="366" fill="#CBD5E1" font-size="12.2">590k intact reference vs 670k cleared controls across 85 bioregions (AUC ≈ 0.95)</text>
  <rect x="1308" y="316" width="248" height="66" rx="9" fill="#1F1533" stroke="#A855F7" stroke-width="1.8"/>
  <text x="1432" y="344" text-anchor="middle" fill="#F8FAFC" font-size="15" font-weight="800">Output 3: Climax Match</text>
  <text x="1432" y="367" text-anchor="middle" fill="#D8B4FE" font-size="12.2">0 – 100% reference match</text>

  <rect x="712" y="396" width="576" height="68" rx="9" fill="#0F2625" stroke="#2DD4BF" stroke-width="1.8"/>
  <text x="728" y="422" fill="#2DD4BF" font-size="14.5" font-weight="700">Head 4 · Native Plant Mix (Detached Adapter)</text>
  <text x="728" y="446" fill="#CBD5E1" font-size="12.2">200k botanical survey plots + 108k cleared controls  |  Clean false-positive rejection (9%)</text>
  <rect x="1308" y="396" width="248" height="68" rx="9" fill="#0D2625" stroke="#2DD4BF" stroke-width="1.8"/>
  <text x="1432" y="424" text-anchor="middle" fill="#F8FAFC" font-size="15" font-weight="800">Output 4: Native Mix</text>
  <text x="1432" y="447" text-anchor="middle" fill="#5EEAD4" font-size="12.2">0 – 100% native share</text>

  <rect x="712" y="478" width="576" height="68" rx="9" fill="#10212F" stroke="#60A5FA" stroke-width="1.8"/>
  <text x="728" y="504" fill="#60A5FA" font-size="14.5" font-weight="700">Head 5 · Tree Canopy Cover (Detached + Transect Offset)</text>
  <text x="728" y="528" fill="#CBD5E1" font-size="12.2">80k national canopy samples + 4,400 field transects  |  Error halved (6.1% → 3.4%)</text>
  <rect x="1308" y="478" width="248" height="68" rx="9" fill="#0D1F33" stroke="#60A5FA" stroke-width="1.8"/>
  <text x="1432" y="506" text-anchor="middle" fill="#F8FAFC" font-size="15" font-weight="800">Output 5: Tree Canopy</text>
  <text x="1432" y="529" text-anchor="middle" fill="#93C5FD" font-size="12.2">0 – 100% overstorey cover</text>

  <rect x="712" y="560" width="576" height="80" rx="9" fill="#27190E" stroke="#F59E0B" stroke-width="2.2"/>
  <text x="728" y="586" fill="#FBBF24" font-size="14.2" font-weight="800">Head 6 · Grazing Condition (Domain-Invariant + Monotonic)</text>
  <text x="728" y="608" fill="#CBD5E1" font-size="12.2">3,400 road-filtered paddock ratings ONLY (≥ 80 m off road) + local anomaly vector</text>
  <text x="728" y="629" fill="#FDE68A" font-size="12" font-weight="600">Non-crossing thresholds guarantee A + B + C + D probabilities sum to 100%</text>
  <rect x="1308" y="560" width="248" height="80" rx="9" fill="#2A190C" stroke="#F59E0B" stroke-width="2.2"/>
  <text x="1432" y="588" text-anchor="middle" fill="#F8FAFC" font-size="15" font-weight="800">Outputs 6–10: Grazing</text>
  <text x="1432" y="611" text-anchor="middle" fill="#FBBF24" font-size="12.2">Score + P(A), P(B), P(C), P(D)</text>
  <text x="1432" y="631" text-anchor="middle" fill="#94A3B8" font-size="11.8">Exact 100% probability sum</text>

  <!-- ARROWS -->
  <path d="M 173 290 L 173 324" stroke="#38BDF8" stroke-width="2.2" fill="none" marker-end="url(#arrSky)"/>
  <path d="M 304 202 L 361 202" stroke="#38BDF8" stroke-width="2.4" fill="none" marker-end="url(#arrSky)"/>
  <path d="M 304 378 C 335 378, 335 222, 361 222" stroke="#A855F7" stroke-width="2.2" fill="none" marker-end="url(#arrViolet)"/>
  <path d="M 173 468 L 173 501" stroke="#A855F7" stroke-width="2.2" fill="none" marker-end="url(#arrViolet)"/>
  <path d="M 506 250 L 506 280" stroke="#2DD4BF" stroke-width="2.4" fill="none" marker-end="url(#arrCyan)"/>

  <path d="M 646 326 C 678 326, 678 189, 707 189" stroke="#38BDF8" stroke-width="2.2" fill="none" marker-end="url(#arrSky)"/>
  <path d="M 646 352 C 675 352, 675 269, 707 269" stroke="#10B981" stroke-width="2.2" fill="none" marker-end="url(#arrEmerald)"/>
  <path d="M 646 378 C 678 378, 678 349, 707 349" stroke="#A855F7" stroke-width="2.2" fill="none" marker-end="url(#arrViolet)"/>
  <path d="M 646 410 C 678 410, 678 430, 707 430" stroke="#2DD4BF" stroke-width="2.2" stroke-dasharray="5 3" fill="none" marker-end="url(#arrCyan)"/>
  <path d="M 646 440 C 678 440, 678 512, 707 512" stroke="#60A5FA" stroke-width="2.2" stroke-dasharray="5 3" fill="none" marker-end="url(#arrSky)"/>
  <path d="M 646 468 C 675 468, 675 588, 707 588" stroke="#FB7185" stroke-width="2.2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrRose)"/>
  <path d="M 304 590 C 340 590, 330 645, 506 645 C 660 645, 675 612, 707 612" stroke="#F59E0B" stroke-width="2.6" fill="none" marker-end="url(#arrAmber)"/>

  <line x1="1288" y1="189" x2="1303" y2="189" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrSky)"/>
  <line x1="1288" y1="269" x2="1303" y2="269" stroke="#10B981" stroke-width="2" marker-end="url(#arrEmerald)"/>
  <line x1="1288" y1="349" x2="1303" y2="349" stroke="#A855F7" stroke-width="2" marker-end="url(#arrViolet)"/>
  <line x1="1288" y1="430" x2="1303" y2="430" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arrCyan)"/>
  <line x1="1288" y1="512" x2="1303" y2="512" stroke="#60A5FA" stroke-width="2" marker-end="url(#arrSky)"/>
  <line x1="1288" y1="600" x2="1303" y2="600" stroke="#F59E0B" stroke-width="2.4" marker-end="url(#arrAmber)"/>

  <rect x="24" y="676" width="1552" height="58" rx="10" fill="#161F30" stroke="#334155" stroke-width="1.5"/>
  <text x="800" y="702" text-anchor="middle" fill="#F8FAFC" font-size="14.5" font-weight="700">
    Portable Self-Contained Inference Graph (~3 MB per model)  |  1.2 Billion Pixels Processed in ~40 Minutes on a Single Cloud GPU
  </text>
  <text x="800" y="723" text-anchor="middle" fill="#94A3B8" font-size="12.8">
    Solid arrows: Shared Trunk Backprop  |  Dashed arrows: Detached Adapters (Native Mix, Tree Canopy) &amp; Isolated Grazing Head
  </text>
</svg>
